<main class="main">
  <div class="content">
    <h1>Signals From zero to hero</h1>

    <app-coin label="En Real (R$)" [value]="counter()" locale="BRL" />

    <div class="counter-actions">
      <button (click)="decrease()">-</button>
      <button (click)="increase()">+</button>
    </div>

    <app-coin label="Em Dolar ($)" [value]="counterAsDolar()" locale="BRL" />

    <app-coin label="Em Euro (€)" value="10" locale="EUR" />

  </div>
</main>
